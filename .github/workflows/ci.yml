name: Validate webstory
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: npx --no-install tsc --noEmit
      - run: npm run build
